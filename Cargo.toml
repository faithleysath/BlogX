[package]
name = "blogx"
version = "0.4.10"
edition = "2024"
license = "MIT"
description = "HTML+CSS-first static site compiler"
repository = "https://github.com/faithleysath/BlogX"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
comrak = { version = "0.48", features = ["syntect"] }
html-escape = "0.2"
include_dir = "0.7"
katex = "0.4"
minijinja = { version = "2.12", features = ["debug", "loader"] }
notify = "8.2"
notify-debouncer-mini = "0.7"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
syntect = "5.2"
tiny_http = "0.12"
toml = "0.9"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"

[[bin]]
name = "blogx"
path = "src/main.rs"
